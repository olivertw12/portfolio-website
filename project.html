    <div id="lightbox" class="bg-scrim fixed inset-0 z-lightbox hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-sm">

    <!--SLOT:BOOT-->
    <script>
    (function () {
        'use strict';
        var id = new URLSearchParams(window.location.search).get('id');
        var d  = projectData[id];

        if (!d) {
            document.getElementById('main-content').style.display = 'none';
            var err = document.getElementById('error-screen');
            err.classList.remove('hidden');
            err.classList.add('flex');
            return;
        }

        document.title = d.title + ' | Oliver T. Williams';
        var desc = (d.card && d.card.blurb) || '';
        document.querySelector('meta[name="description"]').setAttribute('content', desc);
        document.querySelector('meta[property="og:title"]').setAttribute('content', d.title + ' | Oliver T. Williams');
        document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
        document.querySelector('link[rel="canonical"]').setAttribute('href', 'https://olivertwilliams.com' + projectHref(id));

        document.getElementById('p-header').innerHTML = projectHeader(d);
        document.getElementById('p-body').innerHTML   = projectLayout(d);
        document.getElementById('p-next').innerHTML   = nextProjectHTML(id);

        if (d.layout !== 'technical') initLightbox(galleryImages(d));
        document.getElementById('main-content').classList.remove('opacity-0');
    })();
    </script>
    <!--/SLOT-->
